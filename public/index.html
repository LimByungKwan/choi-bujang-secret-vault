<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .auth-panel { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 8px; background: #1a2a3d; }
    .auth-panel h2 { margin: 0 0 14px; font-size: 21px; }
    .auth-form { display: grid; gap: 12px; }
    .auth-form label { display: grid; gap: 6px; color: #bfd0e5; }
    .auth-form input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #71869b; border-radius: 6px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth-panel button { padding: 11px 16px; border: 0; border-radius: 6px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .auth-panel button:disabled { cursor: wait; opacity: .65; }
    .auth-error { color: #ffe3e8; }
    .note-form { display: grid; gap: 12px; margin: 20px 0; }
    .note-form label { display: grid; gap: 6px; color: #bfd0e5; }
    .note-form input, .note-form textarea { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #71869b; border-radius: 6px; background: #101a28; color: #ecf4ff; font: inherit; }
    .note-form textarea { min-height: 120px; resize: vertical; }
    .note-form button, .note-actions button { padding: 8px 12px; border: 0; border-radius: 6px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    .note-actions .delete-button { background: #e6a3ae; }
    .note-form button:disabled, .note-actions button:disabled { cursor: wait; opacity: .65; }
    [hidden] { display: none !important; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 자료실</div>
    <h1>점령된 자료실</h1>
    <p>Supabase 학습 테이블에 저장된 아래 기록은 모두 실습용 가상 자료입니다.</p>
    <div class="notice">자료를 반환하는 /api/notes는 Supabase 로그인 토큰을 확인합니다.</div>
    <section class="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">학습 계정 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다.</p>
      <form id="login-form" class="auth-form" hidden>
        <label for="login-email">이메일
          <input id="login-email" name="email" type="email" autocomplete="email" required>
        </label>
        <label for="login-password">비밀번호
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
        <p id="login-error" class="auth-error" role="alert" hidden></p>
      </form>
      <div id="account-view" hidden>
        <p><span id="account-email"></span> 계정으로 로그인했습니다.</p>
        <button id="logout-button" type="button">로그아웃</button>
        <p id="logout-error" class="auth-error" role="alert" hidden></p>
      </div>
      <p id="auth-init-error" class="auth-error" role="alert" hidden></p>
    </section>
    <form id="note-form" class="note-form" hidden>
      <label for="note-title">메모 제목
        <input id="note-title" name="title" type="text" required>
      </label>
      <label for="note-body">메모 내용
        <textarea id="note-body" name="body" required></textarea>
      </label>
      <div class="note-actions">
        <button id="note-submit" type="submit">메모 추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </div>
      <p id="note-error" class="auth-error" role="alert" hidden></p>
    </form>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
